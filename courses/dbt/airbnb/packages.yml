# packages.yml = the "requirements.txt" of dbt.
# `dbt deps` downloads these into dbt_packages/ (don't commit that folder).
packages:
  - package: dbt-labs/dbt_utils        # the most used package: helper macros + extra generic tests
    version: [">=1.3.0", "<2.0.0"]     # any 1.x from 1.3 up; never jump to a breaking 2.0
