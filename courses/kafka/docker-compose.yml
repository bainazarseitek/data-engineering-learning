# Single-node Kafka 4 (KRaft mode, no ZooKeeper) plus a web UI, for the Kafka course.
# From your Mac, clients connect to localhost:9092. Other containers use kafka:19092.
# Data lives inside the container: `docker compose stop` keeps it, `docker compose down` wipes it.

services:
  kafka:
    image: apache/kafka:4.3.2
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      # One broker, so every internal topic can only have one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "learning"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:19092"
    depends_on:
      kafka:
        condition: service_healthy

  # Conduktor Console: a second, heavier UI on http://localhost:8081.
  # It needs its own PostgreSQL database to store users and settings.
  conduktor-db:
    image: postgres:16
    container_name: conduktor-db
    environment:
      POSTGRES_DB: "conduktor"
      POSTGRES_USER: "conduktor"
      POSTGRES_PASSWORD: "conduktor"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduktor -d conduktor"]
      interval: 5s
      timeout: 5s
      retries: 10

  conduktor:
    image: conduktor/conduktor-console:1.47.2
    container_name: conduktor
    ports:
      - "8081:8080"
    environment:
      CDK_DATABASE_URL: "postgresql://conduktor:conduktor@conduktor-db:5432/conduktor"
      # Local-only login for the course; not a real secret.
      CDK_ADMIN_EMAIL: "admin@conduktor.io"
      CDK_ADMIN_PASSWORD: "Admin123!"
      CDK_CLUSTERS_0_ID: "learning"
      CDK_CLUSTERS_0_NAME: "learning"
      CDK_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:19092"
    depends_on:
      kafka:
        condition: service_healthy
      conduktor-db:
        condition: service_healthy
